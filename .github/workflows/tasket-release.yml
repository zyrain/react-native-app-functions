# Builds the package and attaches its tarball to a GitHub release when a
# `v*-tasket.*` tag is pushed. Fruit Tasket installs that tarball by URL; release
# assets of a public repository download without a token.
name: Tasket release

on:
  push:
    tags:
      - "v*-tasket.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check the tag matches the package version
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }

      - name: Build
        run: yarn prepare

      # npm pack, not yarn pack: yarn pack leaves out codegen/lib, which the
      # Android Gradle script runs. Scripts already ran in the build step.
      - name: Pack
        run: |
          npm pack --ignore-scripts
          tarball="react-native-app-functions-$(node -p "require('./package.json').version").tgz"
          for file in package/codegen/lib/cli.js package/app.plugin.js package/lib/module/index.js package/android/appfunctions.gradle; do
            tar tzf "$tarball" | grep -qx "$file" || { echo "$file is missing from $tarball"; exit 1; }
          done
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$TARBALL" --prerelease --title "$GITHUB_REF_NAME" \
            --notes "Prerelease for Fruit Tasket (commit $GITHUB_SHA): upstream plus the Expo config plugin."
